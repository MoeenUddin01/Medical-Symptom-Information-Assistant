# Nginx configuration for MedAssist React frontend
# Serves the static SPA and proxies API requests to the backend

# Limit request body size to prevent abuse
client_max_body_size 1m;

# Enable gzip compression for text-based responses
gzip on;
gzip_types text/plain text/css application/json application/javascript text/javascript;

# Serve static assets with aggressive caching
location ~* \.(js|css|png|jpg|svg|ico)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public";
}

# Proxy API requests to the FastAPI backend service
location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Serve React SPA with client-side routing fallback
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}